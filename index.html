<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Alert</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .alert-box {
      background-color: #2c2c2c;
      border: 2px solid red;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 0 20px red;
    }

    .alert-box h1 {
      color: red;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .alert-box p {
      font-size: 18px;
      margin: 10px 0;
    }

    .contact {
      margin-top: 30px;
      font-weight: bold;
      font-size: 16px;
      color: #ccc;
    }

    .contact span {
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <div class="alert-box">
    <h1>⚠ Payment Issue Detected</h1>
    <p>You have not cleared the pending payment.</p>
    <p>As a result, your website has been suspended.</p>
    <p>If you clear the payment, we will immediately restore your site.</p>
    <p>If not, a penalty of $30 per day will be added.</p>
    <div class="contact">
      Contact for Payment Clearance: <br />
      <span>+92 324 1283937</span>
    </div>
  </div>
</body>
</html>
