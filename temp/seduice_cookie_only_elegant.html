<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seduice – Cookie Consent</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #1a0c2b;
      color: #f0e6dc;
      margin: 0;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      color: #e4b58c;
      font-size: 36px;
    }

    .cookie-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #29143f;
      color: #f0e6dc;
      padding: 25px 20px;
      font-size: 15px;
      z-index: 10000;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.4);
      animation: slideUp 0.5s ease-in-out;
    }

    .cookie-banner p {
      margin: 0 0 12px;
    }

    .cookie-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .cookie-buttons button {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background-color: #e4b58c;
      color: #1a0c2b;
      transition: background-color 0.3s ease;
    }

    .cookie-buttons button:hover {
      background-color: #f4c390;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .cookie-buttons {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>Welcome to Seduice</h1>

  <div id="cookieBanner" class="cookie-banner">
    <p>
      This website uses cookies to enhance your experience. You can accept or reject cookies at any time.
    </p>
    <div class="cookie-buttons">
      <button onclick="acceptCookies()">Accept</button>
      <button onclick="rejectCookies()">Reject</button>
    </div>
  </div>

  <script>
    function acceptCookies() {
      localStorage.setItem("cookiesConsent", "accepted");
      document.getElementById("cookieBanner").style.display = "none";
    }

    function rejectCookies() {
      localStorage.setItem("cookiesConsent", "rejected");
      document.getElementById("cookieBanner").style.display = "none";
    }

    window.onload = function () {
      const consent = localStorage.getItem("cookiesConsent");
      if (!consent) {
        document.getElementById("cookieBanner").style.display = "block";
      }
    };
  </script>
</body>
</html>
