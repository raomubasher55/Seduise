<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seduice - Age Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="agePopup" class="popup-overlay">
    <div class="popup-box">
      <div class="popup-header">
        <h1 class="logo">Seduice</h1>
        <span class="badge">18+</span>
      </div>
      <p>This website contains adult content and is intended for users aged 18 and over only.</p>
      <p>By continuing, you confirm that you are of legal age.</p>
      <div class="popup-buttons">
        <button class="btn-enter" onclick="acceptAge()">I am 18 or older – Enter</button>
        <button class="btn-leave" onclick="window.location.href='https://www.google.com'">Leave</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
